name: KlimatMobile
options:
  bundleIdPrefix: se.yeager
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Klimat
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Klimat searches your local Wi-Fi network for compatible air conditioners.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
targets:
  KlimatMobile:
    type: application
    platform: iOS
    sources:
      - path: KlimatMobile
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: se.yeager.klimat.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: KlimatMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: KlimatMobile/KlimatMobile.entitlements
    dependencies:
      - target: KlimatWatchApp
        embed: true
        copy:
          destination: plugins

  KlimatWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: KlimatWatch/App
      - path: KlimatWatch/WatchApp
      - path: KlimatMobile
        includes:
          - "**/*.lproj/Localizable.strings"
    info:
      path: KlimatWatch/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Klimat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: se.yeager.klimat.ios
        WKRunsIndependentlyOfCompanionApp: false
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.yeager.klimat.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
