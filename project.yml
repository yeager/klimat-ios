name: KlimatMobile
options:
  bundleIdPrefix: se.yeager
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Klimat
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Klimat söker efter kompatibla luftkonditioneringsapparater på ditt lokala nätverk.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    INFOPLIST_KEY_NSBonjourServices:
      - _http._tcp
      - _https._tcp
targets:
  KlimatMobile:
    type: application
    platform: iOS
    sources:
      - path: KlimatMobile
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: se.yeager.klimat.ios
        INFOPLIST_FILE: KlimatMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: KlimatMobile/KlimatMobile.entitlements
        CODE_SIGNING_ALLOWED: NO
